version: "3"

networks:
  cloud-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
#          gateway:
#          ip_range:


services:

  gateway: # 网关
    build:
      context: ./gateway
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
#      - "5105:5105"
    networks:
      cloud-net:
        aliases:
          - gateway #在 cloud-net 网络中当前服务的别名
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/docker/logs:/app/logs

  authority: # 权限服务
    build:
      context: ./authority
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"
    networks:
      cloud-net:
        aliases:
          - authority #在 cloud-net 网络中当前服务的别名
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/docker/logs:/app/logs

  user: # 用户服务
    build:
      context: ./user
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8083:8083"
#      - "5105:5105"
    networks:
      cloud-net:
        aliases:
          - user #在 cloud-net 网络中当前服务的别名
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/docker/logs:/app/logs

  realtime: # 实时服务 视频
    build:
      context: ./realtime
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8085:8085"
    #      - "5105:5105"
    networks:
      cloud-net:
        aliases:
          - realtime #在 cloud-net 网络中当前服务的别名
    extra_hosts:
      - "host.docker.internal:host-gateway" # host-gateway 指向默认网桥
    volumes:
      - /data/docker/logs:/app/logs

